{{- /* Responsive photo from static/images/sesja. Params: name, alt, class, sizes, eager */ -}}
{{- $base := printf "images/sesja/%s" .name -}}
<img src="{{ printf "%s-800.webp" $base | relURL }}"
     srcset="{{ printf "%s-800.webp" $base | relURL }} 800w, {{ printf "%s-1600.webp" $base | relURL }} 1600w"
     sizes="{{ .sizes | default "(min-width: 768px) 50vw, 100vw" }}"
     alt="{{ .alt }}" class="{{ .class }}"
     {{ if .eager }}fetchpriority="high"{{ else }}loading="lazy" decoding="async"{{ end }}>
