{{ define "main" }}
<header class="bg-primary text-white print:hidden">
  <div class="max-w-7xl mx-auto px-6 py-6 flex items-center justify-between">
    <a href="/" class="text-lg font-semibold hover:text-accent transition-colors">Pure Shape Studio</a>
    <a href="/" class="text-sm md:text-base hover:text-accent transition-colors">Powrót na stronę główną</a>
  </div>
</header>

<main class="py-20 bg-white print:py-0">
  <div class="max-w-4xl mx-auto px-6 print:max-w-none print:px-0">
    <div class="hidden print:flex items-center justify-between border-b border-ink/15 pb-3 mb-10 text-ink">
      <span class="flex items-center gap-2 font-display text-lg"><span class="logo-mark w-6 h-6"></span>Pure Shape Studio</span>
      <span class="text-xs text-ink/60">pure-shape.pl · info@pure-shape.pl · 698 190 880</span>
    </div>
    <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold text-primary text-center mb-6 print:font-display print:font-normal print:text-4xl print:mb-2">{{ .Title }}</h1>
    {{ with .Params.subtitle }}
      <p class="text-center text-gray-600 text-lg max-w-2xl mx-auto mb-14 print:text-base print:mb-8">{{ . }}</p>
    {{ end }}

    <article class="space-y-6 text-gray-700 print:space-y-3 print:text-[10pt] print:text-ink print:[&_h2]:text-[13pt] print:[&_h2]:mt-6 print:[&_h2]:mb-2 print:[&_ol]:space-y-1.5 print:[&_ul]:space-y-1 print:[&_a]:text-ink print:[&_a]:no-underline [&_h2]:text-2xl [&_h2]:font-bold [&_h2]:text-primary [&_h2]:mt-10 [&_h2]:mb-4 [&_ol]:list-decimal [&_ol]:list-inside [&_ol]:space-y-3 [&_ol]:leading-relaxed [&_ul]:list-disc [&_ul]:list-inside [&_ul]:space-y-2 [&_ul]:leading-relaxed [&_p]:leading-relaxed [&_a]:text-accent [&_a]:hover:underline">
      {{ .Content }}
    </article>
  </div>
</main>
{{ end }}
