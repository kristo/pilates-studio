team:
  eyebrow: 'O nas'
  title: 'Poznaj <em class="italic">zespół</em>'
  lead: 'Jesteśmy pasjonatkami ruchu i&nbsp;zdrowego stylu życia. Razem tworzymy przestrzeń, w&nbsp;której każdy znajdzie swoje miejsce.'
  read_more: 'Czytaj więcej'
  collapse: 'Zwiń opis'
  members:
    - id: gosia
      name: 'Małgorzata Pilińska-Babula'
      role: 'Właścicielka studia · instruktorka fitness i Pilates'
      bio: 'Certyfikowana instruktorka fitness i Pilates, pracująca z kobietami na różnych etapach życia. Specjalizuje się w treningu funkcjonalnym, ciąży i powrocie do formy po porodzie.'
      more: 'Certyfikowana instruktorka Balanced Body i promotorka świadomego ruchu. Na zajęciach łączy technikę, oddech i indywidualne podejście do potrzeb każdej kobiety.'
      instagram: 'https://www.instagram.com/gosia.pilinska/'
    - id: ania
      name: 'Anna Soczowka'
      role: 'Trenerka · siła i sprawność'
      bio: 'Pomaga budować siłę, sprawność i pewność siebie dzięki dobrze dopasowanym planom treningowym. Stawia na regularność, zdrowie i widoczne efekty.'
      more: 'Pracuje zarówno z osobami początkującymi, jak i zaawansowanymi, dbając o bezpieczną technikę i plan treningowy dopasowany do celu oraz możliwości.'
    - id: dorota
      name: 'Dorota Wodzień-Kowalczyk'
      role: 'Nauczycielka jogi · RYT 200'
      bio: 'Certyfikowana nauczycielka jogi (RYT 200) w stylach Ashtanga, Vinyasa i Yin. Tworzy zajęcia, które łączą ruch, oddech i regenerację.'
      more: 'Jej praktyka opiera się na uważności i pracy z ciałem bez presji. Pomaga odzyskać równowagę, mobilność i spokój w codziennym funkcjonowaniu.'
    - id: olivia
      name: 'Olivia'
      role: 'Fizjoterapeutka i instruktorka pilates'
      bio: 'Prowadzi zajęcia Pilates Reformer i na macie dla kobiet na każdym etapie życia. Pomaga wzmacniać ciało, poprawiać postawę i pracować bez bólu. Ukończyła fizjoterapię na Collegium Medicum UJ i stale rozwija swoje umiejętności poprzez kursy i szkolenia.'
      more: 'Specjalizuje się w pracy z kobietami od pierwszej miesiączki, przez ciążę i połóg, aż po menopauzę. W treningu stawia na precyzję, stabilizację i świadomą pracę mięśni głębokich.'
    - id: klaudia
      name: 'Klaudia Pyszniak'
      role: 'Instruktorka pilatesu · certyfikacja Balanced Body'
      bio: 'Prowadzi energetyczne, dynamiczne treningi, a także zajęcia z klasycznymi zasadami pilatesu — pełne precyzji i kontroli.'
      more: 'W trakcie kompletnej certyfikacji Balanced Body, łączy klasyczne fundamenty metody z nowoczesnym podejściem do treningu. Stale rozwija swoje umiejętności, szukając nowych inspiracji — jej zajęcia wzmacniają ciało, poprawiają sprawność i sprawiają, że czujesz się lepiej.'
    - id: zuza
      name: 'Zuza'
      role: 'Recepcja'
      bio: 'Przywita Cię w studiu, pomoże z rezerwacją, karnetem i odpowie na pytania.'

