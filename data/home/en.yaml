team:
  eyebrow: 'About us'
  title: 'Meet the <em class="italic">team</em>'
  lead: 'We’re passionate about movement and healthy living. Together we’ve created a space where everyone can find their place.'
  read_more: 'Read more'
  collapse: 'Show less'
  members:
    - id: gosia
      name: 'Małgorzata Pilińska-Babula'
      role: 'Studio owner · fitness & Pilates instructor'
      bio: 'Certified fitness and Pilates instructor working with women at every stage of life. She specialises in functional training, pregnancy and postnatal recovery.'
      more: 'Certified Balanced Body instructor and advocate of mindful movement. Her classes combine technique, breathing and an individual approach to every woman’s needs.'
      instagram: 'https://www.instagram.com/gosia.pilinska/'
    - id: ania
      name: 'Anna Soczowka'
      role: 'Coach · strength & fitness'
      bio: 'Helps you build strength, fitness and confidence with well-tailored training plans. She focuses on consistency, health and visible results.'
      more: 'Works with beginners and advanced clients alike, ensuring safe technique and a plan matched to your goals and abilities.'
    - id: dorota
      name: 'Dorota Wodzień-Kowalczyk'
      role: 'Yoga teacher · RYT 200'
      bio: 'Certified yoga teacher (RYT 200) in Ashtanga, Vinyasa and Yin. Her classes bring together movement, breath and recovery.'
      more: 'Her practice is rooted in mindfulness and working with the body without pressure. She helps you regain balance, mobility and calm in everyday life.'
    - id: olivia
      name: 'Olivia'
      role: 'Physiotherapist & pilates instructor'
      bio: 'Teaches reformer and mat Pilates for women at every stage of life, helping them strengthen the body, improve posture and move without pain. She graduated in physiotherapy from Jagiellonian University Medical College and keeps developing through courses and training.'
      more: 'She specialises in working with women from their first period, through pregnancy and postpartum, to menopause. Her training focuses on precision, stability and mindful deep-muscle work.'
    - id: klaudia
      name: 'Klaudia Pyszniak'
      role: 'Pilates instructor · Balanced Body certification'
      bio: 'Leads energetic, dynamic workouts as well as classes built on classical pilates principles — full of precision and control.'
      more: 'Currently completing her full Balanced Body certification, she combines the classical foundations of the method with a modern approach to training. Always looking for new inspiration — her classes strengthen the body, improve fitness and simply make you feel better.'
    - id: zuza
      name: 'Zuza'
      role: 'Front desk'
      bio: 'She’ll welcome you to the studio and help with bookings, passes and any questions.'

